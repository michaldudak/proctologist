packages:
  - packages/*
  - apps/*
allowBuilds:
  # Compiles the native SQLite binding.
  better-sqlite3: true
  # Downloads the prebuilt Electron binary.
  electron: true
  esbuild: true
  # Windows installer tooling pulled in by electron-builder; the app is macOS only.
  electron-winstaller: false
minimumReleaseAgeExclude:
  - "@cloudflare/kumo@2.13.2"
